version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    groups:
      # One PR for routine bumps; majors stay separate so they get real review.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
